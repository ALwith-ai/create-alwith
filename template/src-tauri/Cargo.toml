[package]
name = "alwith-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "alwith_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ALwithApp"
path = "src/main.rs"

[features]
# Debug-only automation bridge for the tauri-hasgard CLI and MCP server; release builds never include it.
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri-plugin-alwith-desktop-shell = { path = "../node_modules/@alwith/module-desktop-shell/rust" }
alwith-api = { path = "../node_modules/@alwith/api/rust" }
alwith-module-store = { path = "../node_modules/@alwith/module-store/rust", features = ["tauri"] }
alwith-auth-client = { path = "../node_modules/@alwith/module-auth/rust", features = ["pets"] }
alwith-native-client = { path = "../node_modules/@alwith/native-kit/rust" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-plugin-http = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-hasgard = { version = "0.6.1", optional = true }
tauri-runtime-wry = "3.0.0-alpha.5"
tokio = { version = "1", features = ["full"] }
