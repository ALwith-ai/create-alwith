[package]
name = "alwith-app"
version = "0.1.0"
edition = "2024"

[lib]
name = "alwith_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ALwithApp"
path = "src/main.rs"

[features]
# Debug-only automation bridge for the tauri-hasgard CLI and MCP server; release builds never include it.
hasgard-testing = ["dep:tauri-plugin-hasgard"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
alwith-desktop-shell = "0.6"
alwith-api = "0.6"
alwith-chat = "0.6"
alwith-store = "0.6"
alwith-auth = "0.6"
alwith-extension = "0.6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "3.0.0-alpha.6", features = ["protocol-asset"] }
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-http = "3.0.0-alpha.3"
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
# alwith:updates:begin
tauri-plugin-updater = { version = "3.0.0-alpha.3", default-features = false, features = ["system-proxy"] }
# alwith:updates:end
tauri-plugin-hasgard = { version = "0.8", optional = true }
tauri-runtime-wry = "3.0.0-alpha.6"
tokio = { version = "1", features = ["full"] }
